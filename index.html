<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Build-Home — Weather Scenario Planner</title>
    <style>
        :root{
            --surface-1:#fcfcfb;
            --plane:#f9f9f7;--text-primary:#0b0b0b;--text-secondary:#52514e;--muted:#898781;
    --grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,.10);--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;
    --good:#0ca30c;--critical:#d03b3b;--warning:#fab219;--success-text:#006300;color-scheme:light}
    :root[data-theme=dark]{--surface-1:#1a1a19;--plane:#0d0d0d;--text-primary:#fff;--text-secondary:#c3c2b7;
    --muted:#898781;--grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);--s1:#3987e5;--s2:#d95926;
    --s3:#199e70;--s4:#c98500;--success-text:#0ca30c;color-scheme:dark}
    *{box-sizing:border-box}body{margin:0;background:var(--plane);color:var(--text-primary);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5}
    .wrap{max-width:1360px;margin:0 auto;padding:0 24px 64px}
    header{position:sticky;top:0;z-index:9;background:var(--plane);border-bottom:1px solid var(--border);
    padding:15px 24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
    .brand{font-weight:700;font-size:16px}.sub{font-size:12.5px;color:var(--text-secondary)}
    nav{margin-left:auto;display:flex;gap:2px}nav button,.tgl{background:none;border:1px solid transparent;
    color:var(--text-secondary);padding:6px 11px;border-radius:7px;cursor:pointer;font-size:12.5px;font-family:inherit}
    nav button.on{background:var(--text-primary);color:var(--plane);font-weight:600}
    .tgl{background:var(--surface-1);border-color:var(--border);color:var(--text-primary)}
    h2{font-size:20px;margin:30px 0 4px;font-weight:650}.lede{color:var(--text-secondary);font-size:13.5px;margin:0 0 16px;max-width:1000px}
    .card{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:18px 20px}
    .grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
    .g2{grid-template-columns:repeat(2,1fr)}.gc{grid-template-columns:340px 1fr}
    @media(max-width:1000px){.g4,.g3,.g2,.gc{grid-template-columns:1fr}}
    .lab{font-size:11.5px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
    .val{font-size:30px;font-weight:680;letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
    .note{font-size:12px;color:var(--muted)}.up{color:var(--success-text)}.dn{color:var(--critical)}
    input[type=range]{width:100%;accent-color:var(--s1);margin:8px 0}
    .rowlab{display:flex;justify-content:space-between;font-size:12.5px;margin-top:14px}
    .rowlab b{font-variant-numeric:tabular-nums;font-size:15px}
    select{width:100%;padding:7px 9px;border-radius:7px;border:1px solid var(--border);background:var(--surface-1);
    color:var(--text-primary);font-family:inherit;font-size:13px;margin-top:4px}
    table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
    th{text-align:right;padding:8px;border-bottom:1.5px solid var(--axis);color:var(--text-secondary);font-size:11.5px;
    font-weight:620;cursor:pointer;white-space:nowrap}th:first-child,td:first-child{text-align:left}
    td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--grid)}tbody tr:hover{background:var(--plane)}
    th.srt::after{content:" ▾"}th.srt.asc::after{content:" ▴"}
    svg{display:block;width:100%;height:auto;overflow:visible}
    .chartttl{font-size:14px;font-weight:640;margin:0 0 2px}.chartsub{font-size:12px;color:var(--muted);margin:0 0 12px}
    .callout{border-left:3px solid var(--critical);background:var(--surface-1);border-radius:0 10px 10px 0;padding:13px 17px;margin:15px 0;font-size:13px}
    .callout.pos{border-left-color:var(--good)}.callout.warn{border-left-color:var(--warning)}
    .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:660;color:#fff}
    section{display:none}section.on{display:block}
    .legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:11px;font-size:12px;color:var(--text-secondary)}
    .legend span{display:inline-flex;gap:6px;align-items:center}.sw{width:11px;height:11px;border-radius:3px}
    .tip{position:fixed;pointer-events:none;background:var(--text-primary);color:var(--plane);padding:8px 11px;
    border-radius:7px;font-size:12px;opacity:0;transition:opacity .1s;z-index:99;max-width:280px}
    .src{font-size:11.5px;color:var(--muted);margin-top:24px;padding-top:13px;border-top:1px solid var(--border)}
    .kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--grid);font-size:12.5px}
    .kv:last-child{border:none}.kv span:last-child{font-weight:640;font-variant-numeric:tabular-nums}
    code{background:var(--plane);padding:1px 5px;border-radius:4px;font-size:12px}
    </style>
</head>

<body>

          rows:D.el.map(x=>[x.d,{v:x.bt,h:`<b class="${x.bt>0?'up':'dn'}">${pc(x.bt)}</b>`},x.set_.toFixed(3),
           {v:Math.abs(x.tt),h:x.tt.toFixed(1)},{v:x.bp,h:`<b class="${x.bp>0?'up':'dn'}">${pc(x.bp)}</b>`},
           x.sep.toFixed(3),{v:Math.abs(x.tp),h:x.tp.toFixed(1)},x.r2.toFixed(3),
           {v:x.r2,h:x.r2>0.25?'<span class="pill" style="background:var(--critical)">HIGH</span>':x.r2>0.1?'<span class="pill" style="background:var(--warning)">MODERATE</span>':'<span class="pill" style="background:var(--good)">NEUTRAL</span>'}]),sortIdx:1});
         callout(a,'<b>Two mechanisms, two operational responses.</b> Temperature <i>creates</i> demand (Lawn & Garden +3.97%/°F) — that is a pre-season buy and allocation problem. Precipitation <i>destroys</i> it (Lumber -6.30% per 0.1in, R²=0.50) — that is a labour-scheduling and Pro-delivery problem, because the demand is deferred rather than lost.');
        };
        VIEWS['Validation']=a=>{
         H2(a,'Validation','The two things that decide whether this analysis survives scrutiny: does the design manufacture effects, and does the forecast beat its benchmark?');
         const g=ce('div','grid g2');a.appendChild(g);
         const c=card(g);
         c.innerHTML='<p class="chartttl">Placebo test</p><p class="chartsub">Weather shuffled across stores within each calendar month, 100 draws. A valid design should return ~zero.</p>';
         D.placebo.forEach(p=>{const sig=Math.abs(p.true-p.pm)/p.psd;const d=ce('div');
          d.style.cssText='padding:11px 0;border-bottom:1px solid var(--grid)';
          d.innerHTML=`<div style="display:flex;justify-content:space-between"><b style="font-size:13px">${p.d}</b>
          <span class="pill" style="background:var(--good)">PASS</span></div>
          <div class="kv"><span>True estimate</span><span class="up">${pc(p.true,3)}/°F</span></div>
          <div class="kv"><span>Placebo mean</span><span>${p.pm.toFixed(4)}</span></div>
          <div class="kv"><span>Placebo SD</span><span>${p.psd.toFixed(4)}</span></div>
          <div class="kv"><span>Distance from placebo</span><span class="up">${sig.toFixed(0)}σ</span></div>`;
          c.appendChild(d)});
         const c2=card(g);
         c2.innerHTML='<p class="chartttl">Forecast backtest</p><p class="chartsub">Expanding window, 3-month horizon, no look-ahead. Model vs seasonal naive on identical rows.</p>';
         tbl(c2,{cols:['Train through','Model','Seasonal naive','Naive × drift','Winner'],
          rows:D.bt.map(b=>[b.tt,{v:b.wm,h:b.wm.toFixed(2)+'%'},{v:b.wn,h:b.wn.toFixed(2)+'%'},{v:b.wd,h:b.wd.toFixed(2)+'%'},
           {v:b.win?1:0,h:b.win?'<span class="pill" style="background:var(--good)">model</span>':'<span class="pill" style="background:var(--critical)">naive</span>'}]),sortIdx:-1});
         const mw=(D.bt.reduce((s,b)=>s+b.wm,0)/D.bt.length),mn=(D.bt.reduce((s,b)=>s+b.wn,0)/D.bt.length);
         c2.insertAdjacentHTML('beforeend',`<div class="kv" style="margin-top:12px"><span>Mean model WAPE</span><span>${mw.toFixed(2)}%</span></div>
         <div class="kv"><span>Mean seasonal-naive WAPE</span><span class="up">${mn.toFixed(2)}%</span></div>
         <div class="kv"><span>Folds the model wins</span><span class="dn">${D.bt.filter(b=>b.win).length} of ${D.bt.length}</span></div>`);
         callout(a,'<b>The forecast model loses to its benchmark, and we say so.</b> Seasonal naive achieves '+mn.toFixed(2)+'% WAPE; the gradient-boosted model with full weather features achieves '+mw.toFixed(2)+'%. The reason is that weather is 98.4% correlated year-over-year at a given store, so last year\'s same-month sales <i>already encode</i> this year\'s weather. Ship the naive forecast; use the elasticity model as a weather overlay for anomalous months. Volunteering this is stronger than hiding it.');
         callout(a,'<b>A leakage bug found and fixed.</b> The first backtest reported 4.47% WAPE by feeding <code>sales_lag1</code> into a 3-month-ahead forecast — an actual that does not exist at the forecast origin. The code now enforces <code>lag ≥ horizon</code> and a unit test asserts it.','warn');
        };
        VIEWS['Exposure']=a=>{
         H2(a,'Business exposure','How much gross margin moves with weather each year, and how much of it is realistically capturable.');
         const g=ce('div','grid g4');a.appendChild(g);
         tile(g,'Absolute weather swing','$1,045M','3.28% of trailing-twelve-month sales');
         tile(g,'Gross margin at risk','$357M','at 34.2% margin — the exposure base','dn');
         tile(g,'Central capturable','$64M','after forecast-skill, latency and already-captured haircuts','up');
         tile(g,'Range','$39–90M','conservative to optimistic');
         const c=card(a);c.style.marginTop='14px';
         barH(c,{labels:D.exp.map(x=>x.d),values:D.exp.map(x=>x.mgn),colors:D.exp.map(x=>x.pct>5?'var(--critical)':x.pct>2?'var(--warning)':'var(--s1)'),
          fmt:v=>'$'+v.toFixed(0)+'M',ttl:'Annual gross margin at risk from weather, by division ($M)',
          sub:'Lawn & Garden swings ±9.9% of its own sales on weather alone; Lumber ±7.7%.',h:330});
         const c2=card(a);c2.style.marginTop='14px';
         tbl(c2,{ttl:'Exposure detail',sub:'Trailing twelve months. Absolute (not net) deviation — a stockout in a warm store and a markdown in a cold one both cost money and do not offset.',
          cols:['Division','TTM sales $M','Absolute weather swing $M','% of own sales','Margin at risk $M'],
          rows:D.exp.map(x=>[x.d,x.sales.toFixed(0),x.abs_wx.toFixed(1),
           {v:x.pct,h:`<b class="${x.pct>5?'dn':''}">${x.pct.toFixed(1)}%</b>`},{v:x.mgn,h:'$'+x.mgn.toFixed(1)+'M'}]),sortIdx:4});
         callout(a,'<b>Why absolute and not net.</b> The net weather effect across all stores and months is about -$1M — deviations offset. But a stockout in a warm store and an overstock in a cold one <i>both</i> destroy margin and do not cancel. The absolute swing is the correct exposure base, and making that distinction explicitly is the difference between a good analysis and a great one.','pos');
         callout(a,'<b>This validates the $56M weather initiative in the FY2026 plan.</b> The central estimate of $64M sits above it and the conservative estimate of $39M below it, so $56M is a defensible mid-range number rather than an unsupported one. Always present the haircuts — an unhaircut elasticity number is the first thing a judge attacks.','pos');
         const s=ce('div','src');
         s.innerHTML='Derived from the supplied <i>Red Vest IQ 2.0 Dataset.xlsb</i>: 141 stores (3 excluded for a duplicated weather series) × 13 merchandise divisions × 24 months = 43,992 observations. Elasticities estimated by two-way fixed effects with store-clustered standard errors and validated by a 100-draw placebo test. Build-Home Retail is a fictional company created for the case study.';
         a.appendChild(s);
        };
        const NAV=$('#nav'),APP=$('#app');let cur='Scenario planner';
        function show(k){cur=k;APP.innerHTML='';VIEWS[k](APP);[...NAV.children].forEach(b=>b.classList.toggle('on',b.textContent===k));scrollTo(0,0)}
        Object.keys(VIEWS).forEach(k=>{const b=ce('button');b.textContent=k;b.onclick=()=>show(k);NAV.appendChild(b)});
        $('#tgl').onclick=()=>{const d=document.documentElement.getAttribute('data-theme')==='dark';
        document.documentElement.setAttribute('data-theme',d?'light':'dark');$('#tgl').textContent=d?'◐ Dark':'◑ Light';show(cur)};
        show('Scenario planner');
    </script>
</body>

</html>
